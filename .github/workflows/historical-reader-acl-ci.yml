name: Historical reader least-privilege ACL review (CI-only PostgreSQL)

on:
  pull_request:
    paths:
      - db/security/legacy_history_reader_STAGING_REVIEW.sql
      - tests/integration/test_legacy_reader_access.py
      - .github/workflows/historical-reader-acl-ci.yml
  push:
    branches: [main]
    paths:
      - db/security/legacy_history_reader_STAGING_REVIEW.sql
      - tests/integration/test_legacy_reader_access.py
      - .github/workflows/historical-reader-acl-ci.yml

permissions:
  contents: read

jobs:
  disposable-db-privileges:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-password-not-real
          POSTGRES_DB: investment_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investment_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      ISL_TEST_POSTGRES_URL: postgresql://postgres:fixture-password-not-real@127.0.0.1:5432/investment_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic-test PostgreSQL adapter
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify no-login ACL in disposable service — no Neon credentials
        run: python -m unittest discover -s tests/integration -p test_legacy_reader_access.py -v
