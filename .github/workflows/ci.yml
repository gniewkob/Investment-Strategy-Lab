name: Investment Strategy Lab v2 Sprint1 CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL test adapter for offline DSN checks
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test offline fixture (no DB writes or live orders)
        run: python -m src.isl_v2.pipeline --input fixtures/sample.json --output /tmp/isl-smoke.json
  postgres-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password-not-production
          POSTGRES_DB: research_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d research_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ISL_TEST_POSTGRES_URL: postgresql://postgres:ci-only-password-not-production@127.0.0.1:5432/research_ci
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL test adapter only
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Apply SQL migration and test synthetic revisions and PIT
        run: python -m unittest discover -s tests/integration -v
