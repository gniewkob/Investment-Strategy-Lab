name: Investment Strategy Lab v2 Sprint1 CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test offline fixture (no DB writes or live orders)
        run: python -m src.isl_v2.pipeline --input fixtures/sample.json --output /tmp/isl-smoke.json
