name: ISL v0.4 original official Eurostat PL bond yield source probe
on:
  pull_request:
    paths:
      - 'scripts/eurostat_pl_bond_yield_source_probe_v04.py'
      - 'tests/test_eurostat_pl_bond_yield_source_probe_v04.py'
      - '.github/workflows/isl-eurostat-pl-yield-probe-v04.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No-network schema-probe unit tests
        run: |
          python - <<'PY'
          import socket, unittest
          def deny(*args, **kwargs):
              raise RuntimeError("UNEXPECTED_OFFLINE_NETWORK")
          socket.socket.connect = deny
          socket.socket.connect_ex = deny
          socket.create_connection = deny
          suite = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_eurostat_pl_bond_yield_source_probe_v04")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 5:
              raise SystemExit("EUROSTAT_SOURCE_PROBE_UNIT_FAILURE")
          PY
  official-source-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Official original public Eurostat data, schema-only stdout
        run: |
          python -m scripts.eurostat_pl_bond_yield_source_probe_v04 --allow-public-eurostat-read
