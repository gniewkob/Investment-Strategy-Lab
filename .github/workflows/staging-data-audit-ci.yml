name: Staging point-in-time audit offline tests (no secrets)

on:
  pull_request:
    paths:
      - scripts/staging_data_audit.py
      - tests/test_staging_data_audit.py
      - .github/workflows/staging-data-audit*.yml
  push:
    branches: [main]
    paths:
      - scripts/staging_data_audit.py
      - tests/test_staging_data_audit.py
      - .github/workflows/staging-data-audit*.yml

permissions:
  contents: read

jobs:
  offline-pit-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DSN parsing test adapter
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Test data gate, alerts and secret-safe reports
        run: python -m unittest discover -s tests -v
