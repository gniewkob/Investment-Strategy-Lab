name: Neon staging PIT data readiness audit (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isl-staging-data-readiness
  cancel-in-progress: false

jobs:
  inspect-data-quality:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: research-staging
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Check staging SSL, ACL and PIT provenance (read only)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_RESEARCH_DATABASE_URL }}
        run: python -m scripts.staging_preflight
      - name: Audit vintage, future local timestamps and minimum research coverage
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_RESEARCH_DATABASE_URL }}
          ISL_DATA_AUDIT_DIR: artifacts/data-audit
        run: python -m scripts.staging_data_audit
      - name: Upload sanitized audit only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staging-pit-data-audit
          path: artifacts/data-audit/
          if-no-files-found: error
          retention-days: 7
