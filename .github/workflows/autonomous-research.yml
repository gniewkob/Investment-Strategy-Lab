name: Autonomous Investment Research (paper only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal DB adapter
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Run autonomous research, log decisions, evaluate mature hypotheses
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python -m src.isl_v2.agent_runner --out-dir artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-research-report
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
