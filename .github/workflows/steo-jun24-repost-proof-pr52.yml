name: STEO jun24 archived Table10b evidence - PR52 only

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/steo-jun24-repost-proof-pr52.yml
      - scripts/steo_jun24_repost_audit.py
      - tests/test_steo_jun24_repost_audit.py

permissions:
  contents: read

jobs:
  single-issue-original-source-research:
    if: github.event.pull_request.number == 52 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic tests (not real market evidence)
        run: python -m unittest discover -s tests -p 'test_steo_jun24_repost_audit.py' -v
      - name: One-shot read-only Wayback originals and June-2024 Table 10b source comparison
        run: python -m scripts.steo_jun24_repost_audit
