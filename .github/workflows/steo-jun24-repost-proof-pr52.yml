name: STEO jun24 archived Table10b evidence - PR52 only

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/steo-jun24-repost-proof-pr52.yml
      - scripts/steo_jun24_repost_audit.py
      - tests/test_steo_jun24_repost_audit.py
      - docs/STEO_NEAR_RELEASE_CAPTURE_INVESTIGATION_2026_10_20_PL.md

permissions:
  contents: read

jobs:
  single-issue-original-source-research:
    if: github.event.pull_request.number == 52 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic tests (not real market evidence)
        run: python -m unittest discover -s tests -p 'test_steo_jun24_repost_audit.py' -v
      - name: Read-only Wayback XLSX originals and June-2024 Table 10b source comparison
        run: python -m scripts.steo_jun24_repost_audit

  full-offline-regression:
    if: github.event.pull_request.number == 52 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only offline test adapter
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Entire existing offline Python suite plus new Table 10b tests
        run: python -m unittest discover -s tests -v

  disposable-postgres-synthetic-integration:
    if: github.event.pull_request.number == 52 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: investment_lab
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investment_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ISL_TEST_POSTGRES_URL: postgresql://postgres:disposable-ci-fixture-only@127.0.0.1:5432/investment_lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ephemeral isolated PostgreSQL adapter
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Existing disposable PostgreSQL 16 source/PIT tests (not Neon)
        run: python -m unittest discover -s tests/integration -p 'test_eia_versioned_pg.py' -v
