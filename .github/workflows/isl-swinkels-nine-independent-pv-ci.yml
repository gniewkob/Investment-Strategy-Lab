name: ISL Swinkels nine-bond independent cashflow PV (one-shot)

on:
  pull_request:
    paths:
      - 'scripts/swinkels_nine_independent_cashflow_pv_v01.py'
      - 'tests/test_swinkels_nine_independent_cashflow_pv_v01.py'
      - '.github/workflows/isl-swinkels-nine-independent-pv-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-pv-synthetic-math:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ten synthetic zero, negative-yield and PV math tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_swinkels_nine_independent_cashflow_pv_v01 -v

  official-source-independent-pv:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent nine-variant 36-month source PV reconciliation
        run: |
          set -euo pipefail
          python -m scripts.swinkels_nine_independent_cashflow_pv_v01
      - name: Model and point-in-time qualification remain closed
        if: always()
        run: |
          echo "QUALIFIED_MODEL_SERIES=[]"
          echo "HISTORICAL_PIT_CERTIFIED=false"
          echo "M1_M2_M3=HOLD_CASH"
          echo "FINANCIAL_OPERATIONS=0"
