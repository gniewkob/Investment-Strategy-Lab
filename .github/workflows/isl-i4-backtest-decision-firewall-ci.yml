name: ISL I4 backtest-to-decision firewall offline acceptance

# A1 output can only be acknowledged as HOLD_CASH, never a qualified
# market-data source, paper candidate, order, or production authorization.
# Research-only, synthetic fixtures. Network denied for all test modules.
on:
  pull_request:
    paths:
      - 'scripts/research_backtest_decision_boundary_v01.py'
      - 'scripts/research_decision_pipeline_v16.py'
      - 'tests/test_research_backtest_decision_boundary_v01.py'
      - 'docs/I4_BACKTEST_DECISION_FIREWALL_ACCEPTANCE_20261109_PL.md'
      - '.github/workflows/isl-i4-backtest-decision-firewall-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firewall-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test A1-to-C1 fail-closed firewall and unchanged independent engines offline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import socket
          import unittest

          def deny_network(*_a, **_k):
              raise AssertionError('I4 test attempted network')
          socket.socket.connect = deny_network
          socket.socket.connect_ex = deny_network
          socket.create_connection = deny_network

          modules = [
              'tests.test_research_backtest_decision_boundary_v01',
              'tests.test_research_decision_pipeline_v16',
              'tests.test_monthly_proxy_backtest_v04',
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != 52 or result.skipped:
              raise SystemExit('I4_FAIL_CLOSED_FIREWALL_TESTS_BLOCKED')
          print('I4_BACKTEST_DECISION_FIREWALL_PASS tests=' + str(result.testsRun))
          print('I4_NO_BACKTEST_PROMOTION_NO_SOURCE_QUALIFICATION')
          PY
      - name: Declare non-production boundary
        run: echo 'NO_MARKET_SOURCE_NO_NEON_NO_WALLET_NO_BROKER_NO_ORDERS'

  firewall-macos:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test A1-to-C1 fail-closed firewall and unchanged independent engines offline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import socket
          import unittest

          def deny_network(*_a, **_k):
              raise AssertionError('I4 test attempted network')
          socket.socket.connect = deny_network
          socket.socket.connect_ex = deny_network

          modules = [
              'tests.test_research_backtest_decision_boundary_v01',
              'tests.test_research_decision_pipeline_v16',
              'tests.test_monthly_proxy_backtest_v04',
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != 52 or result.skipped:
              raise SystemExit('I4_FAIL_CLOSED_FIREWALL_TESTS_BLOCKED')
          print('I4_BACKTEST_DECISION_FIREWALL_PASS tests=' + str(result.testsRun))
          print('I4_NO_BACKTEST_PROMOTION_NO_SOURCE_QUALIFICATION')
          PY
      - name: Declare non-production boundary
        run: echo 'NO_MARKET_SOURCE_NO_NEON_NO_WALLET_NO_BROKER_NO_ORDERS'
