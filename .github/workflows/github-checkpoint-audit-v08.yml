name: ISL v0.8 independent GitHub checkpoint audit
on:
  pull_request:
    paths:
      - 'scripts/github_checkpoint_verify_v08.py'
      - 'tests/test_github_checkpoint_verify_v08.py'
      - '.github/workflows/github-checkpoint-audit-v08.yml'
  workflow_dispatch:
    inputs:
      capture_run_id:
        description: 'Existing successful v0.7 GitHub Actions capture run ID'
        required: true
        type: string
      cutoff_utc:
        description: 'Declared independent audit cutoff, ISO UTC (not a trusted timestamp)'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline integrity and cutoff regression
        run: python -m unittest discover -s tests -p 'test_github_checkpoint_verify_v08.py' -v
      - name: Corroborate earlier successful capture using independent GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          INPUT_RUN_ID: ${{ inputs.capture_run_id }}
          INPUT_CUTOFF_UTC: ${{ inputs.cutoff_utc }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoint-evidence/source
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Cross-run GitHub server creation time; not a self-declared source timestamp.
            export CUTOFF_UTC="$(gh api "repos/gniewkob/Investment-Strategy-Lab/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
            gh api "repos/gniewkob/Investment-Strategy-Lab/actions/runs?per_page=100&event=pull_request&status=success" \
              > checkpoint-evidence/prior-runs.json
            RUN_ID="$(python -c 'import json,os; rs=json.load(open("checkpoint-evidence/prior-runs.json"))["workflow_runs"]; prior=[r for r in rs if r.get("path","").split("@")[0]==".github/workflows/shadow-capture-v07.yml" and r.get("head_branch")==os.environ["HEAD_REF"] and r.get("created_at","")<os.environ["CUTOFF_UTC"]]; print(prior[0]["id"] if prior else "")')"
            test -n "$RUN_ID" || { echo 'No completed earlier v0.7 capture available for this PR'; exit 1; }
          else
            RUN_ID="$INPUT_RUN_ID"
            CUTOFF_UTC="$INPUT_CUTOFF_UTC"
          fi
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,17}$ ]] || { echo 'invalid run id'; exit 1; }
          gh api "repos/gniewkob/Investment-Strategy-Lab/actions/runs/$RUN_ID" > checkpoint-evidence/run.json
          gh api "repos/gniewkob/Investment-Strategy-Lab/actions/runs/$RUN_ID/artifacts?per_page=100" > checkpoint-evidence/artifacts.json
          RUN_ATTEMPT="$(python -c 'import json; print(json.load(open("checkpoint-evidence/run.json"))["run_attempt"])')"
          NAME="isl-v07-shadow-capture-run-${RUN_ID}-attempt-${RUN_ATTEMPT}"
          gh run download "$RUN_ID" --repo gniewkob/Investment-Strategy-Lab \
            --name "$NAME" --dir checkpoint-evidence/source
          test -s checkpoint-evidence/source/shadow-capture-v07.json
          python -m scripts.github_checkpoint_verify_v08 \
            --capture checkpoint-evidence/source/shadow-capture-v07.json \
            --run checkpoint-evidence/run.json \
            --artifacts checkpoint-evidence/artifacts.json \
            --cutoff-utc "$CUTOFF_UTC" \
            --output github-checkpoint-audit-v08.json
      - name: Save only bounded audit receipt (not source archive)
        uses: actions/upload-artifact@v4
        with:
          name: isl-v08-checkpoint-audit-${{ github.run_id }}
          path: github-checkpoint-audit-v08.json
          if-no-files-found: error
          retention-days: 90
