permissions:
  contents: read
jobs:
  postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investment_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investment_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated database test driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Validate NBP capture and SQL compilation without network
        run: |
          python -m unittest discover -s tests -p 'test_nbp_lab_prepare.py' -v
          python -m unittest discover -s tests -p 'test_nbp_lab_ingest_sql.py' -v
          python -m unittest discover -s tests -p 'test_nbp_lab_daily_source.py' -v
      - name: Validate GEM availability audit offline
        run: python -m unittest discover -s tests -p 'test_world_bank_gem_audit_v04.py' -v
      - name: Validate TBSP dated-source and digest controls offline
        run: python -m unittest discover -s tests -p 'test_tbsp_official_archive_v04.py' -v
      - name: Validate month-end BondSpot history parser offline
        run: python -m unittest discover -s tests -p 'test_bondspot_monthly_archive_v04.py' -v
      - name: Validate official provider source candidate detection offline
        run: python -m unittest discover -s tests -p 'test_official_market_source_probe_v04.py' -v
      - name: Validate local Mac NAV preflight shell syntax
        run: bash -n scripts/run_local_vanguard_nav_preflight_v04.sh
      - name: Validate complete local NAV XLSX and exact-date NBP source bundle
        run: python -m unittest discover -s tests -p 'test_vanguard_nav_intake_bundle_v04.py' -v
      - name: Validate WorldPulse.ai financial source availability fail-close
        run: python -m unittest discover -s tests -p 'test_worldpulse_nav_availability_v04.py' -v
      - name: Validate safe original NAV XLSX intake with no fund-identity assumptions
        run: python -m unittest discover -s tests -p 'test_vanguard_xlsx_offline_intake_v04.py' -v
      - name: Validate authenticated offline NAV USD to exact-day NBP PLN conversion
        run: python -m unittest discover -s tests -p 'test_vanguard_nav_to_pln_reference_v04.py' -v
      - name: Validate calendar mismatches and proof integrity offline
        run: python -m unittest discover -s tests -p 'test_reference_archive_calendar_v04.py' -v
      - name: Validate 60-month NBP archive window controls offline
        run: python -m unittest discover -s tests -p 'test_nbp_long_history_monthly.py' -v
      - name: Validate frozen forward reference attribution with no execution
        run: python -m unittest discover -s tests -p 'test_shadow_forward_evaluation_v05.py' -v
      - name: Validate ordered multi-period shadow receipts without financial execution
        run: python -m unittest discover -s tests -p 'test_shadow_journal_v06.py' -v
      - name: Validate v0.7 independent-run-context capture input controls
        run: python -m unittest discover -s tests -p 'test_shadow_capture_v07.py' -v
      - name: Validate v0.8 GitHub checkpoint integrity and fail-closed retrospective gates
        run: python -m unittest discover -s tests -p 'test_github_checkpoint_verify_v08.py' -v
      - name: Validate v0.9 durable local evidence ledger, idempotency and tamper detection
        run: python -m unittest discover -s tests -p 'test_shadow_evidence_ledger_v09.py' -v
      - name: Validate v0.10 externally pinned anchor and deleted-tail detection
        run: python -m unittest discover -s tests -p 'test_shadow_external_anchor_v10.py' -v
      - name: Validate v0.11 private snapshot and safe restore drill
        run: python -m unittest discover -s tests -p 'test_shadow_backup_restore_v11.py' -v
      - name: Validate v0.12 isolated host install and no-overwrite behavior
        run: python -m unittest discover -s tests -p 'test_deploy_shadow_evidence_mac_v12.py' -v
      - name: Validate v0.13 explicit destination copy and adversarial path controls
        run: python -m unittest discover -s tests -p 'test_shadow_offsite_export_v13.py' -v
      - name: Validate read-only shadow decisions and source-quality fail-close
        run: python -m unittest discover -s tests -p 'test_shadow_decision_engine_v05.py' -v
      - name: Validate v0.15 source-gated M1-M3 decision orchestration and M3 confirmation
        run: python -m unittest discover -s tests -p 'test_research_decision_controller_v15.py' -v
      - name: Validate v0.17 chronological research journal and later forward results
        run: python -m unittest discover -s tests -p 'test_research_forward_journal_v17.py' -v
      - name: Validate v0.18 official reference gateway fail-closed model source classification
        run: python -m unittest discover -s tests -p 'test_real_reference_gateway_v18.py' -v
      - name: Validate v0.19 licensed ACWI NETR offline intake and exact-day NBP FX coverage
        run: python -m unittest discover -s tests -p 'test_acwi_netr_offline_intake_v19.py' -v
      - name: Validate v0.20 conditional NAV M1 vs cash arithmetic and source-status gates
        run: python -m unittest discover -s tests -p 'test_conditional_m1_nav_diagnostic_v20.py' -v
      - name: Validate v0.21 actual-source-contract XIRR, drawdown and scenario analysis
        run: python -m unittest discover -s tests -p 'test_conditional_m1_nav_analytics_v21.py' -v
      - name: Validate v0.22 frozen prospective NAV policy and false-forward rejection
        run: python -m unittest discover -s tests -p 'test_nav_forward_freeze_v22.py' -v
      - name: Run v0.16 decision cycle against real archived source plus tamper tests
        run: |
          python -m unittest discover -s tests -p 'test_research_decision_pipeline_v16.py' -v
          python -m scripts.research_decision_pipeline_v16 --archived-v09 evidence/shadow/v09/checkpoint-bundle-run-42305280062.json

      - name: Validate v0.4 monthly backtester, no database/network
        run: python -m unittest discover -s tests -p 'test_monthly_proxy_backtest_v04.py' -v
      - name: Validate v0.14 non-executable cost sensitivity and missing-data gates
        run: python -m unittest discover -s tests -p 'test_monthly_cost_sensitivity_v14.py' -v
      - name: Verify live SQL script against disposable Postgres
        env:
          ISL_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/investment_lab
        run: |
          python -m unittest discover -s tests/integration -p 'test_working_engine_v01.py' -v
          python -m unittest discover -s tests/integration -p 'test_monthly_backtest_v04_readiness.py' -v
