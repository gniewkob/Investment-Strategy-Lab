name: Opportunity evidence ledger — offline validation

on:
  pull_request:
    paths:
      - scripts/evidence_decision_ledger.py
      - tests/test_evidence_decision_ledger.py
      - .github/workflows/opportunity-ledger-ci.yml
  push:
    branches: [main]
    paths:
      - scripts/evidence_decision_ledger.py
      - tests/test_evidence_decision_ledger.py
      - .github/workflows/opportunity-ledger-ci.yml

permissions:
  contents: read

jobs:
  educational-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate explanatory ledger, counterfactual limits and no execution
        run: python -m unittest discover -s tests -p 'test_evidence_decision_ledger.py' -v
