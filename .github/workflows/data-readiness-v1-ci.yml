name: Data readiness v1 offline
on:
  pull_request:
    paths: [scripts/data_readiness_v1.py, scripts/nbp_reference_capture.py, tests/test_data_readiness_v1.py, tests/test_nbp_reference_capture.py, .github/workflows/data-readiness-v1-ci.yml]
  push:
    branches: [main]
    paths: [scripts/data_readiness_v1.py, scripts/nbp_reference_capture.py, tests/test_data_readiness_v1.py, tests/test_nbp_reference_capture.py, .github/workflows/data-readiness-v1-ci.yml]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_data_readiness_v1.py' -v
      - run: python -m unittest discover -s tests -p 'test_nbp_reference_capture.py' -v
