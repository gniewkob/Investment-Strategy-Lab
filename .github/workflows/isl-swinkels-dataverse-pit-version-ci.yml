name: ISL Swinkels official Dataverse version and PIT evidence (one-shot)

on:
  pull_request:
    paths:
      - 'scripts/swinkels_dataverse_pit_version_audit_v01.py'
      - 'tests/test_swinkels_dataverse_pit_version_audit_v01.py'
      - '.github/workflows/isl-swinkels-dataverse-pit-version-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-pit-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Eleven synthetic fail-closed version and PIT tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_swinkels_dataverse_pit_version_audit_v01 -v

  original-publisher-version-timeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original publisher ODS SHA and Dataverse published-version metadata
        run: |
          set -euo pipefail
          python -m scripts.swinkels_dataverse_pit_version_audit_v01
      - name: Keep retrospective source outside decision models
        if: always()
        run: |
          echo "RETROSPECTIVE_SERIES_PIT_NOT_CERTIFIED"
          echo "QUALIFIED_MODEL_SERIES=[]"
          echo "M1_M2_M3=HOLD_CASH"
          echo "FINANCIAL_OPERATIONS=0"
