name: Historical reference bridge offline tests (no secrets)

on:
  pull_request:
    paths:
      - scripts/legacy_history_bridge.py
      - tests/test_legacy_history_bridge.py
      - .github/workflows/legacy-history-bridge*.yml
  push:
    branches: [main]
    paths:
      - scripts/legacy_history_bridge.py
      - tests/test_legacy_history_bridge.py
      - .github/workflows/legacy-history-bridge*.yml

permissions:
  contents: read

jobs:
  offline-historical-reader-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser test adapter only
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify source mapping, safe access and educational evidence pipeline offline
        run: python -m unittest discover -s tests -v
