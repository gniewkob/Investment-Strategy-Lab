name: Deposit evidence reconciliation
on:
  pull_request:
    paths:
      - 'scripts/unattended_acceptance.py'
      - 'tests/test_unattended_acceptance.py'
      - 'docs/UNATTENDED_ACCEPTANCE_ISSUE80_PL.md'
      - 'scripts/deposit_evidence_reconciliation.py'
      - 'tests/test_deposit_evidence_reconciliation.py'
      - 'scripts/coinbase_deposit_history.py'
      - 'tests/test_coinbase_deposit_history.py'
      - 'scripts/autonomous_portfolio.py'
      - 'scripts/operational_read_only.py'
      - 'scripts/base_rpc_probe.py'
      - 'tests/test_base_rpc_probe.py'
      - 'docs/BASE_RPC_READ_SOURCE_RECOVERY_PL.md'
      - 'scripts/portfolio_release_canary.py'
      - 'tests/test_portfolio_release_canary.py'
      - 'docs/PORTFOLIO_RELEASE_CANARY_PL.md'
      - 'scripts/history_coverage.py'
      - 'scripts/history_backfill.py'
      - 'tests/test_history_backfill.py'
      - 'docs/BOUNDED_HISTORY_BACKFILL_PL.md'
      - 'tests/test_history_coverage.py'
      - 'docs/ROLLING_HISTORY_COVERAGE_PL.md'
      - 'tests/test_autonomous_portfolio.py'
      - 'docs/AUTONOMOUS_PORTFOLIO_PL.md'
      - 'scripts/autonomous_coinbase_history.py'
      - 'tests/test_autonomous_coinbase_history.py'
      - 'scripts/setup_autonomous_history.py'
      - 'tests/test_setup_autonomous_history.py'
      - 'scripts/autonomous_history_watchdog.py'
      - 'tests/test_autonomous_history_watchdog.py'
      - 'docs/AUTONOMOUS_READ_ONLY_HISTORY_PL.md'
      - 'requirements-autonomous-history.txt'
      - 'docs/DEPOSIT_EVIDENCE_RECONCILIATION_PL.md'
      - '.github/workflows/deposit-evidence-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing offline test adapter (no credentials)
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Install pinned optional signing SDK for ephemeral-key tests only
        run: python -m pip install -r requirements-autonomous-history.txt
      - name: Verify full offline regression suite
        run: python -m unittest discover -s tests -v
