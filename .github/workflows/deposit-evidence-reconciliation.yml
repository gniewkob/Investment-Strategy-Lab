name: Deposit evidence reconciliation
on:
  pull_request:
    paths:
      - 'scripts/deposit_evidence_reconciliation.py'
      - 'tests/test_deposit_evidence_reconciliation.py'
      - '.github/workflows/deposit-evidence-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing offline test adapter (no credentials)
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify full offline regression suite
        run: python -m unittest discover -s tests -v
