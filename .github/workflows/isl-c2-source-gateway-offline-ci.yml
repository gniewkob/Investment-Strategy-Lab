name: ISL C2 source gateway and offline licensed-data audit CI

# Stacked on C1/B1/A2. Candidate data never becomes qualified investment
# returns or an executable security price. All tests synthetic and offline.
on:
  pull_request:
    paths:
      - 'scripts/real_reference_gateway_v18.py'
      - 'tests/test_real_reference_gateway_v18.py'
      - 'scripts/acwi_netr_offline_intake_v19.py'
      - 'tests/test_acwi_netr_offline_intake_v19.py'
      - 'tests/test_a2_explicit_source_access_v01.py'
      - 'scripts/nbp_reference_capture.py'
      - 'scripts/nbp_bondspot_exact_date_v04.py'
      - 'docs/C2_CURRENCY_PROVENANCE_AND_SOURCE_RIGHTS_REVIEW_20261109_PL.md'
      - '.github/workflows/isl-c2-source-gateway-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# Separate named jobs expose Linux scheduling failures independently.
# A green macOS job is not sufficient for overall acceptance.
jobs:
  source-categories-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic source-category and fail-closed audits offline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import socket
          import unittest

          def no_network(*_a,**_k):
              raise AssertionError('C2 source tests attempted external network connection')
          socket.socket.connect=no_network
          socket.socket.connect_ex=no_network
          socket.create_connection=no_network

          tests=unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_real_reference_gateway_v18',
              'tests.test_acwi_netr_offline_intake_v19',
              'tests.test_a2_explicit_source_access_v01',
          ])
          result=unittest.TextTestRunner(verbosity=2).run(tests)
          if not result.wasSuccessful() or result.testsRun!=26 or result.skipped:
              raise SystemExit('C2_OFFLINE_SOURCE_GATE_BLOCKED')
          print('C2_SOURCE_GATEWAY_OFFLINE_PASS tests='+str(result.testsRun))
          print('C2_REAL_SOURCE_LICENSE_AND_PIT_NOT_CERTIFIED')
          PY
      - name: Declare intentional non-production constraints
        run: echo "NO_MSCI_DOWNLOAD_NO_NEON_NO_BROKER_NO_WALLET_NO_TRANSACTIONS"

  source-categories-macos:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic source-category and fail-closed audits offline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import socket
          import unittest

          def no_network(*_a,**_k):
              raise AssertionError('C2 source tests attempted external network connection')
          socket.socket.connect=no_network
          socket.socket.connect_ex=no_network
          socket.create_connection=no_network

          tests=unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_real_reference_gateway_v18',
              'tests.test_acwi_netr_offline_intake_v19',
              'tests.test_a2_explicit_source_access_v01',
          ])
          result=unittest.TextTestRunner(verbosity=2).run(tests)
          if not result.wasSuccessful() or result.testsRun!=26 or result.skipped:
              raise SystemExit('C2_OFFLINE_SOURCE_GATE_BLOCKED')
          print('C2_SOURCE_GATEWAY_OFFLINE_PASS tests='+str(result.testsRun))
          print('C2_REAL_SOURCE_LICENSE_AND_PIT_NOT_CERTIFIED')
          PY
      - name: Declare intentional non-production constraints
        run: echo "NO_MSCI_DOWNLOAD_NO_NEON_NO_BROKER_NO_WALLET_NO_TRANSACTIONS"
