name: Full research runner offline regression tests (no secrets)

on:
  pull_request:
    paths:
      - src/isl_v2/**
      - tests/test_autonomous_agent.py
      - tests/test_agent_runner.py
      - tests/test_full_runner_staging.py
      - .github/workflows/full-agent-staging-canary*.yml
  push:
    branches: [main]
    paths:
      - src/isl_v2/**
      - tests/test_autonomous_agent.py
      - tests/test_agent_runner.py
      - tests/test_full_runner_staging.py
      - .github/workflows/full-agent-staging-canary*.yml

permissions:
  contents: read

jobs:
  offline-educational-research:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test adapter only
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Test source provenance, deterministic research, role validation and full runner
        run: python -m unittest discover -s tests -v
