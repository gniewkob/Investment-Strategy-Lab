name: Full research runner offline regression tests (no secrets)

# Run cross-module offline regression when engine, source, and host safety
# contracts change, not only when the agent runner changes.

on:
  pull_request:
    paths:
      - src/isl_v2/**
      - tests/test_autonomous_agent.py
      - tests/test_agent_runner.py
      - tests/test_full_runner_staging.py
      - db/working_engine_*.sql
      - scripts/nbp_lab_ingest_sql.py
      - scripts/nav_forward_*.py
      - scripts/nav_fx_evidence_capture_v25.py
      - scripts/deploy_shadow_evidence_mac_v12.py
      - scripts/shadow_offsite_export_v13.py
      - tests/integration/test_working_engine_v01.py
      - tests/test_nbp_lab_ingest_sql.py
      - tests/test_nav_forward_*.py
      - tests/test_nav_fx_evidence_capture_v25.py
      - tests/test_deploy_shadow_evidence_mac_v12.py
      - tests/test_shadow_offsite_export_v13.py
      - scripts/public_first_nbp_reference_research_v01.py
      - tests/test_public_first_nbp_reference_research_v01.py
      - scripts/swinkels_*.py
      - tests/test_swinkels_*.py
      - .github/workflows/isl-swinkels-source-bound-stats-ci.yml
      - .github/workflows/full-agent-staging-canary*.yml
  push:
    branches: [main]
    paths:
      - src/isl_v2/**
      - tests/test_autonomous_agent.py
      - tests/test_agent_runner.py
      - tests/test_full_runner_staging.py
      - db/working_engine_*.sql
      - scripts/nbp_lab_ingest_sql.py
      - scripts/nav_forward_*.py
      - scripts/nav_fx_evidence_capture_v25.py
      - scripts/deploy_shadow_evidence_mac_v12.py
      - scripts/shadow_offsite_export_v13.py
      - tests/integration/test_working_engine_v01.py
      - tests/test_nbp_lab_ingest_sql.py
      - tests/test_nav_forward_*.py
      - tests/test_nav_fx_evidence_capture_v25.py
      - tests/test_deploy_shadow_evidence_mac_v12.py
      - tests/test_shadow_offsite_export_v13.py
      - scripts/public_first_nbp_reference_research_v01.py
      - tests/test_public_first_nbp_reference_research_v01.py
      - scripts/swinkels_*.py
      - tests/test_swinkels_*.py
      - .github/workflows/isl-swinkels-source-bound-stats-ci.yml
      - .github/workflows/full-agent-staging-canary*.yml

permissions:
  contents: read

jobs:
  offline-educational-research:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test adapter only
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Test source provenance, deterministic research, role validation and full runner
        run: python -m unittest discover -s tests -v
