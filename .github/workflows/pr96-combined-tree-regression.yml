name: PR96 combined-tree unit and disposable PostgreSQL integration

# Independent integration gate. Unit tests have no DB service; SQL integration
# uses only ephemeral localhost Postgres 16, never Neon, account secrets, wallet,
# external trading API or remote pushes. Both jobs merge into local temp commits.
on:
  pull_request:
    paths:
      - '.github/workflows/pr96-combined-tree-regression.yml'
      - 'scripts/pr96_git_merge_preflight.py'
      - 'tests/test_pr96_git_merge_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-tree-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the actual default branch baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Build clean throwaway integration commit without pushing refs
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DISPATCH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "ISL Integration CI"
          git config user.email "isl-integration-ci@example.invalid"

          BASE="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGET="$PR_HEAD"
          else
            TARGET="$DISPATCH_HEAD"
          fi
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]

          # Direct SHA fetch, not untrusted branch-name shell interpolation.
          git fetch --no-tags origin "$TARGET"
          git cat-file -e "$TARGET^{commit}"
          EXPECTED="$(git merge-tree --write-tree "$BASE" "$TARGET")"
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          git merge --no-ff --no-edit "$TARGET"
          ACTUAL="$(git rev-parse HEAD^{tree})"
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ISL_COMBINED_TREE_VERIFIED=$ACTUAL"
          echo "ISL_EPHEMERAL_HEAD=$(git rev-parse HEAD)"
          echo "ISL_MAIN_BASE=$BASE"
          echo "ISL_RESEARCH_HEAD=$TARGET"
          echo "ISL_NO_REMOTE_PUSH=TRUE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Python dependency for offline mocked tests
        run: |
          python -m pip install 'psycopg[binary]>=3.1,<4'
          python -c 'import psycopg; print("PSYCOPG_AVAILABLE", psycopg.__version__)'
      - name: Full offline unit test suite against clean combined HEAD
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -q
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ISL_COMBINED_UNIT_TESTS_PASS"
      - name: Report explicit safety boundary
        if: always()
        run: |
          echo "NO_DB_SERVICE_NO_SECRETS_NO_TRADING_NO_MAIN_PUSH"
          git status --short

  combined-tree-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investment_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d investment_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout the real default branch baseline
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify local merge result and commit only on disposable runner
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DISPATCH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "ISL Integration CI"
          git config user.email "isl-integration-ci@example.invalid"
          BASE="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGET="$PR_HEAD"
          else
            TARGET="$DISPATCH_HEAD"
          fi
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$TARGET"
          git cat-file -e "$TARGET^{commit}"
          EXPECTED="$(git merge-tree --write-tree "$BASE" "$TARGET")"
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          git merge --no-ff --no-edit "$TARGET"
          ACTUAL="$(git rev-parse HEAD^{tree})"
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ISL_POSTGRES_COMBINED_TREE_VERIFIED=$ACTUAL"
          echo "ISL_POSTGRES_RESEARCH_HEAD=$TARGET"
          echo "ISL_POSTGRES_MAIN_BASE=$BASE"
          echo "ISL_NO_REMOTE_PUSH=TRUE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated local PostgreSQL test driver
        run: |
          python -m pip install 'psycopg[binary]>=3.1,<4'
          python -c 'import psycopg; print("PSYCOPG_AVAILABLE", psycopg.__version__)'
      - name: Strict localhost verification before destructive SQL fixture
        env:
          ISL_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/investment_lab
        run: |
          python - <<'PY'
          import os
          import psycopg
          dsn = os.environ["ISL_TEST_POSTGRES_DSN"]
          parsed = psycopg.conninfo.conninfo_to_dict(dsn)
          assert parsed["host"] == "localhost"
          assert parsed["dbname"] == "investment_lab"
          assert parsed["user"] == "postgres"
          with psycopg.connect(dsn) as conn:
              assert conn.info.host in ("localhost", "127.0.0.1", "::1")
              assert conn.execute("SELECT current_database()").fetchone()[0] == "investment_lab"
          print("DISPOSABLE_POSTGRES_16_LOCALHOST_ONLY")
          PY
      - name: Verify real v0.1–v0.3 research SQL and v0.4 source readiness
        shell: bash
        env:
          ISL_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/investment_lab
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/integration -p 'test_working_engine_v01.py' -v
          python -m unittest discover -s tests/integration -p 'test_monthly_backtest_v04_readiness.py' -v
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ISL_COMBINED_POSTGRES_INTEGRATION_PASS"
      - name: Confirm no production connectivity or repository push
        if: always()
        run: |
          echo "LOCAL_DISPOSABLE_POSTGRES_ONLY_NO_NEON_NO_BROKER_NO_WALLET_NO_PUSH"
          git status --short
