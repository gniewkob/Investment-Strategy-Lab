name: Historical reference research bridge — manual, restricted reader required

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isl-legacy-reference-research
  cancel-in-progress: false

jobs:
  legacy-reference-only:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: research-staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Validate strict identity and export only public historical market references
        env:
          NEON_HISTORICAL_READ_DATABASE_URL: ${{ secrets.NEON_HISTORICAL_READ_DATABASE_URL }}
          ISL_HISTORICAL_REPORT_DIR: artifacts/historical-reference-research
        run: python -m scripts.legacy_history_bridge
      - name: Upload aggregated educational research outputs ONLY
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: historical-reference-research-report
          path: artifacts/historical-reference-research/
          if-no-files-found: error
          retention-days: 7
