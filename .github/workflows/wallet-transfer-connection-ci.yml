name: Local wallet transfer connection
on:
  pull_request:
    paths:
      - 'wallet-portal/**'
      - 'scripts/wallet_transfer_portal.py'
      - 'scripts/panel_observations.py'
      - 'scripts/operational_read_only.py'
      - 'tests/test_wallet_transfer_portal.py'
      - 'tests/test_panel_observations.py'
      - 'tests/test_operational_read_only.py'
      - 'docs/WALLET_TRANSFER_CONNECTION_PL.md'
      - '.github/workflows/wallet-transfer-connection-ci.yml'
permissions:
  contents: read
jobs:
  offline-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix wallet-portal ci --ignore-scripts
      - name: Offline advisory gate negative tests
        run: npm --prefix wallet-portal run test:security
      - name: Report independent release block (not a dependency fix)
        shell: bash
        run: |
          set +e
          node wallet-portal/security-zod-gate.mjs
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo "::warning::Zod dependency release gate BLOCKED; see issue #146. This is NOT a clean security release."
            echo "Zod dependency remediation: BLOCKED (issue #146 OPEN)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$result" -eq 0 ]; then
            echo "Zod static lockfile gate: PASS; separate npm audit, compatibility testing and security review still required." >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$result"
          fi
      - run: npm --prefix wallet-portal test
      - run: npm --prefix wallet-portal run build
      - run: cd wallet-portal && npx playwright install --with-deps chromium
      - run: npm --prefix wallet-portal run test:e2e
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - run: python -m unittest discover -s tests
