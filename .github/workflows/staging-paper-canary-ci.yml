name: Synthetic research canary offline checks (no secrets)

on:
  pull_request:
    paths:
      - scripts/staging_paper_canary.py
      - tests/test_staging_paper_canary.py
      - .github/workflows/staging-paper-canary*.yml
  push:
    branches: [main]
    paths:
      - scripts/staging_paper_canary.py
      - tests/test_staging_paper_canary.py
      - .github/workflows/staging-paper-canary*.yml

permissions:
  contents: read

jobs:
  offline-paper-canary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser/test adapter only
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify synthetic-only canary, ACL and idempotent replay without secrets
        run: python -m unittest discover -s tests -v
